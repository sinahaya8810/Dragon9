<div id="loading"><h1>竜喰いスライム</h1><div>〜 しずくと竜の大地 〜</div><div style="font-size:13px;opacity:.85;margin-top:10px;letter-spacing:.2em">まんまるの命が、竜を喰らい、竜になる。</div><div style="font-size:12px;opacity:.6">世界を紡いでいます…</div><div class="spin"></div></div>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="var s=document.createElement('script');s.crossOrigin='anonymous';s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';document.head.appendChild(s);"></script>
<script>
'use strict';
// ================= 基本ユーティリティ =================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const hash3=w=>hash2(Math.floor(w[0]*37.1+w[2]*11.3),Math.floor(w[1]*53.7+w[2]*29.9));
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)*2-1;}
function fbm(x,y,o=4){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f-i*9.1);f*=2.02;a*=0.5;}return s;}
function ridged(x,y,o=4){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*(1-Math.abs(vnoise(x*f+i*7.7,y*f+i*3.3)));f*=2.03;a*=0.5;}return s;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const RGB={};function rgb(h){let r=RGB[h];if(!r){r=RGB[h]=[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];}return r;}
function shade(h,k){const c=rgb(h);return (clamp(Math.round(c[0]*k*255),0,255)<<16)|(clamp(Math.round(c[1]*k*255),0,255)<<8)|clamp(Math.round(c[2]*k*255),0,255);}
function mixc(a,b,t){const x=rgb(a),y=rgb(b);return (Math.round(lerp(x[0],y[0],t)*255)<<16)|(Math.round(lerp(x[1],y[1],t)*255)<<8)|Math.round(lerp(x[2],y[2],t)*255);}
const hexCss=h=>'#'+h.toString(16).padStart(6,'0');

// ================= 属性・段階 =================
const EL={
  fire:{n:'炎',c:'#ff6a3a',i:'🔥'},grass:{n:'草',c:'#5cd65c',i:'🌿'},water:{n:'水・氷',c:'#4ab0ff',i:'💧'},
  thunder:{n:'雷',c:'#ffd83a',i:'⚡'},earth:{n:'地',c:'#d8a060',i:'🪨'}};
function elMul(a,d){if(!a||!d)return 1;const adv={fire:'grass',grass:'water',water:'fire'};

function buildHead(sp,st,S,gb,gj){

    case 'crestFlame':for(let k=0;k<4;k++){const d=[0,0.9-k*0.12,-0.45-k*0.25];gb.along(P_cone(4),[0,hh*0.45,hl*(0.34-k*0.08)],d,L*(1-k*0.12),[L*0.12,L*0.03],C.a);
        gb.along(P_cone(4),add3([0,hh*0.45,hl*(0.34-k*0.08)],_n3(d),L*(0.7-k*0.08)),d,L*0.45,[L*0.09,L*0.03],0xffe060,true);}break;
    case 'tufts':for(const sd of[-1,1])for(let k=0;k<2;k++)gb.along(P_cone(4),[sd*hw*(0.38+k*0.08),hh*0.52,hl*(0.28-k*0.08)],[sd*(0.35+k*0.2),1,-0.25],L*(1-k*0.25),[L*0.18,L*0.06],l=>l[1]>0.2?C.a:C.h);break;
    case 'flower':{const c=[0,hh*0.55,hl*0.28];for(let i=0;i<6;i++){const a=i/6*TAU;gb.along(P_sphere(5,3),c,[Math.cos(a),0.35,Math.sin(a)],L*0.6,[L*0.26,L*0.05],C.h);}
        gb.add(P_sphere(5,4),{s:L*0.16,t:add3(c,[0,L*0.08,0]),c:0xffe060});break;}
    case 'antenna':for(const sd of[-1,1]){const p0=[sd*hw*0.18,hh*0.48,hl*0.42];const p1=add3(p0,[sd*0.2,0.6,0.25],L),p2=add3(p1,[sd*0.3,0.25,0.05],L);
        gb.tube([p0,p1,p2],rb*0.35,rb*0.25,4,C.h);for(let k=1;k<5;k++){const q=add3(p1,[sd*0.06*k,0.06*k*0.4,0.01*k],L);gb.along(P_cone(3),q,[sd*0.2,0.4,0.8],L*0.18,L*0.02,C.h);}
        gb.add(P_sphere(4,3),{s:rb*0.6,t:p2,c:anc?C.g:C.h,glow:anc});}break;
    case 'twin':for(const sd of[-1,1]){const p0=[sd*hw*0.3,hh*0.42,hl*0.25];gb.tube([p0,add3(p0,[sd*0.2,0.45,0.1],L),add3(p0,[sd*0.3,0.75,0.45],L),add3(p0,[sd*0.28,0.8,0.8],L)],rb*1.2,0,5,hg);}break;
    case 'fins':for(const sd of[-1,1])gb.along(P_cone(3),[sd*hw*0.42,hh*0.25,hl*0.2],[sd*1,0.45,-0.6],L,[L*0.3,L*0.03],l=>l[1]>0.2?C.a:C.w);break;
    case 'nub':for(const sd of[-1,1])gb.add(P_sphere(4,3),{s:Math.max(rb,0.03*S),t:[sd*hb[0],hb[1],hb[2]],c:C.h});break;
  }
  // 頭のエクストラ
  const ex=sp.extras;
  if(ex.includes('whiskers')){const Lw=hl*1.3*(baby?0.5:st===1?0.8:1);for(const sd of[-1,1]){const p0=[sd*hw*0.28,-hh*0.02,(HEADS.serpent.sf+HEADS.serpent.sl*snK*0.85)*hl];
      gb.tube([p0,add3(p0,[sd*0.35,0.05,-0.15],Lw),add3(p0,[sd*0.55,-0.2,-0.45],Lw),add3(p0,[sd*0.5,-0.45,-0.8],Lw)],hw*0.04,hw*0.015,4,anc?C.g:C.a,anc);}
    for(let i=0;i<3;i++)gj.along(P_cone(4),[(i-1)*hw*0.12,-hh*0.12,hl*0.45],[(i-1)*0.2,-1,-0.4],hl*0.4*(st?1:0.5),hw*0.07,C.a);}
  if(ex.includes('mane'))for(let i=0;i<4;i++)gb.add(P_sphere(5,3),{s:[hw*0.32,hh*0.3,hl*0.2],t:[(i%2?1:-1)*hw*0.25,hh*0.35,-hl*0.05-i*hl*0.06],c:i%2?C.a:shade(C.a,0.9)});
  if(ex.includes('neckFrill')){const c=[0,0,hl*0.08],Rr=hw*(baby?1.2:1.8);const n=10;for(let i=0;i<n;i++){const a0=-1.9+i*3.8/n,a1=-1.9+(i+1)*3.8/n;
      const q0=[Math.sin(a0)*Rr,Math.cos(a0)*Rr*0.9,-Rr*0.3],q1=[Math.sin(a1)*Rr,Math.cos(a1)*Rr*0.9,-Rr*0.3];gb.tri(c,q0,q1,i%2?C.h:C.a);}}
  if(ex.includes('petalFrill'))for(let i=0;i<8;i++){const a=i/8*TAU;gb.along(P_sphere(5,3),[0,0,hl*0.05],[Math.cos(a),Math.sin(a),-0.35],hw*1.4,[hw*0.45,hw*0.05],i%2?C.a:shade(C.a,1.15));}
  if(ex.includes('finCrest'))gb.along(P_cone(3),[0,hh*0.35,hl*0.35],[0,0.55,-1],hl*0.95,[hl*0.02,hl*0.32],l=>l[1]>0.3?C.a:C.w);
  if(ex.includes('gills'))for(const sd of[-1,1])for(let k=0;k<2;k++)gb.along(P_cone(3),[sd*hw*0.42,-hh*0.02+k*hh*0.2,hl*0.12],[sd*1,0.2-k*0.4,-0.8],hl*0.45,[hl*0.16,hl*0.02],C.w);
  if(ex.includes('tusks')){const T=hl*0.9*SK.horn[st];for(const sd of[-1,1]){const p0=[sd*hw*0.32,-hh*0.24,hl*0.62];gb.tube([p0,add3(p0,[sd*0.18,-0.08,0.3],T),add3(p0,[sd*0.3,0.25,0.5],T),add3(p0,[sd*0.3,0.5,0.45],T)],hw*0.07,0,5,0xfff4dc);}}
  if(ex.includes('noseHorn')){gb.along(P_cone(5),[0,hh*0.3,hl*0.7],[0,1,0.35],L*0.8,rb*1.6,hg);gb.along(P_cone(4),[0,hh*0.3,hl*0.5],[0,1,0.1],L*0.35,rb*1.1,hg);}
  if(ex.includes('throat'))gj.add(P_sphere(6,4),{s:[hw*0.4,hh*0.3,hl*0.3],t:[0,-hh*0.15,hl*0.25],c:mixc(C.u,0xffffff,0.2)});
  if(ex.includes('mane')&&sp.horn.s==='antenna')gb.add(P_sphere(6,4),{s:[hw*0.7,hh*0.55,hl*0.3],t:[0,-hh*0.25,-hl*0.02],c:C.u});
  if(ex.includes('eyePatch'))for(const sd of[-1,1])gb.add(P_sphere(6,3),{s:[0.06*hw,0.12*hh,0.2*hl],r:[0.2,0,0],t:[sd*0.56*hw,0.18*hh,0.3*hl],c:C.u});
  if(ex.includes('halo')){const R=hw*1.7,c=[0,hh*0.35,-hl*0.12];for(let i=0;i<18;i++){const a=i/18*TAU;gb.add(P_box(),{s:[R*0.2,R*0.05,R*0.05],r:[0,0,a+Math.PI/2],t:add3(c,[Math.cos(a)*R,Math.sin(a)*R,0]),c:C.g,glow:true});
      if(i%3===0)gb.along(P_cone(3),add3(c,[Math.cos(a)*R*1.05,Math.sin(a)*R*1.05,0]),[Math.cos(a),Math.sin(a),0],R*0.35,R*0.05,C.g,true);}}
  if(ex.includes('lure')){const p0=[0,hh*0.45,hl*0.3],p3=[0,hh*1.6,hl*1.35];gb.tube([p0,[0,hh*1.5,hl*0.45],[0,hh*1.9,hl*0.95],p3],hw*0.05,hw*0.03,4,C.a);
    gb.add(P_sphere(6,4),{s:hw*0.2,t:add3(p3,[0,-hh*0.1,0]),c:C.g,glow:true});}
  if(ex.includes('trunk')){const T=hl*1.2*SK.horn[st]+hl*0.3;const p0=[0,-hh*0.05,(H.sf+SL)*hl];
    gb.tube([p0,add3(p0,[0,-0.35,0.2],T),add3(p0,[0,-0.75,0.25],T),add3(p0,[0,-1.05,0.12],T),add3(p0,[0,-1.12,-0.08],T)],hw*0.24,hw*0.08,6,(l,w)=>hash3(w)>0.7?shade(C.b,0.85):C.b);}
  if(ex.includes('casque'))gb.along(P_cone(3),[0,hh*0.35,hl*0.25],[0,0.75,-1],hl*0.95,[hl*0.04,hl*0.42],l=>l[1]>0.2?C.a:C.b);
  if(ex.includes('mandibles')){const M=hl*0.7;for(const sd of[-1,1]){const p0=[sd*hw*0.32,-hh*0.1,(H.sf+SL*0.8)*hl];gb.tube([p0,add3(p0,[sd*0.3,0,0.25],M),add3(p0,[sd*0.2,0,0.6],M),add3(p0,[-sd*0.05,0,0.75],M)],hw*0.1,0,4,C.h);}}
  if(ex.includes('eyeStalks'))for(let k=0;k<6;k++){const a=k/6*TAU;const d=[Math.cos(a)*0.8,1,Math.sin(a)*0.5-0.3];const p0=[0,hh*0.4,hl*0.3];const L2=hl*1.15;
    const p1=add3(p0,[d[0]*0.4,0.6,d[2]*0.4],L2),p2=add3(p0,[d[0],d[1]*0.9,d[2]],L2);gb.tube([p0,p1,p2],hw*0.07,hw*0.04,4,C.a);
    gb.add(P_sphere(5,4),{s:hw*0.13,t:p2,c:0xfffaf0});gb.add(P_sphere(4,3),{s:hw*0.08,t:add3(p2,_n3([d[0],0.2,d[2]+0.5]),hw*0.08),c:C.e,glow:true});}
  // 顎
  const jl=H.jl*(H.sf!==undefined?snK:1)*hl,jr=[H.jr[0]*hw,H.jr[1]*hh];
  if(H.whale){gj.along(P_cyl(0.8,1,8),[0,0,0],[0,-0.03,1],jl,jr,C.u);
    for(let i=-3;i<=3;i++){const x=i*0.075*hw;const y=-jr[1]*Math.sqrt(Math.max(0,1-(x/jr[0])**2))*0.98;gj.along(P_cyl(1,1,3),[x,y,0.08*hl],[0,0.01,1],jl*0.78,[0.012*hw,0.01*hh],shade(C.u,0.8));}}
  else if(sp.head.s==='beak')gj.along(P_cone(4),[0,0,0],[0,-0.1,1],jl,jr,C.a);
  else if(sp.head.s==='maw')gj.along(P_cyl(0.8,1,6),[0,0,0],[0,0.2,1],jl,jr,C.u);
  else if(blocky)gj.add(P_box(),{s:[hw*0.7,hh*0.25,hl*0.55],t:[0,-hh*0.05,hl*0.3],c:C.u});
  else gj.along(P_cyl(H.jt,1,6),[0,0,0],[0,-0.04,1],jl,jr,(l,w)=>l[2]<-0.3?C.u:shade(C.u,0.92));
  if((adult||H.skull||H.teeth===3)&&H.teeth){const n=H.teeth>=2?5:3;for(const sd of[-1,1])for(let i=0;i<n;i++)gj.along(P_cone(3),[sd*jr[0]*0.7*(1-0.3*i/n),jr[1]*0.3,jl*(0.3+0.6*i/n)],[0,1,0.1],hh*(H.teeth===3?0.4:0.12),hw*(H.teeth===3?0.05:0.028),0xfffff0);}
  const hj=[H.jh[0]*hw,H.jh[1]*hh,H.jh[2]*hl];
  return {jaw:hj,hl,hw,hh,mouth:[0,-hh*0.05,hl*(sp.head.s==='maw'?0.8:1.0)]};
}

// ---- 翼 ----
function buildWing(sp,st,W,type,gi,go,pair){
  const C=sp.col,anc=st===3;const Li=W*0.42,Lo=W*0.66,ch=W*0.56;const bone=shade(C.b,0.8),mem=C.w;
  const glowWing=sp.wings.glow;
  const memCol=(l,w)=>hash3(w)>0.85?shade(mem,0.9):mem;
  if(type==='bat'||type==='crystal'||type==='fin'){
    const elbow=[Li,0,-Li*0.12];
    gi.along(P_cyl(0.7,1,5),[0,0,0],elbow,Li*1.02,W*0.035,bone);
    gi.add(P_sphere(5,3),{s:W*0.045,t:elbow,c:bone});
    const cf=type==='fin'?0.6:1;
    gi.tri([0,0,W*0.08],elbow,[Li*0.55,0,-ch*0.7*cf],mem);if(!sp.wings.torn)gi.tri([0,0,W*0.08],[Li*0.55,0,-ch*0.7*cf],[0,0,-ch*0.9*cf],mem);
    const tips=type==='fin'?[[Lo*0.95,0,Lo*0.05],[Lo*0.85,0,-Lo*0.3],[Lo*0.6,0,-Lo*0.55],[Lo*0.3,0,-Lo*0.6]]:[[Lo,0.02*Lo,Lo*0.05],[Lo*0.82,0,-Lo*0.45],[Lo*0.45,0,-Lo*0.8]];
    const back=[-Li*0.45,0,-ch*0.7*cf+Li*0.12];
    for(const t of tips){go.along(P_cyl(0.3,1,4),[0,0,0],t,Math.hypot(...t),W*(type==='fin'?0.014:0.022),type==='fin'?C.a:bone);
      if(anc&&type!=='fin')go.along(P_cyl(0.3,1,4),[0,0.01,0],t,Math.hypot(...t)*0.98,W*0.008,C.g,true);}
    let prev=tips[0];for(let k=1;k<=tips.length;k++){const t=k<tips.length?tips[k]:back;const m=[(prev[0]+t[0])/2*0.82,0,(prev[2]+t[2])/2*0.82];
      if(!(sp.wings.torn&&k%2===1))go.tri([0,0,0],prev,m,memCol);if(!(sp.wings.torn&&k===2))go.tri([0,0,0],m,t,memCol);prev=t;}
    if(type!=='fin'){go.along(P_cone(4),[0,0,0],[0.1,0.2,1],W*0.12*(st>=2?1:0.5),W*0.025,C.h);}
    if(type==='crystal'){for(let k=0;k<4;k++){const p=[Li*(0.15+k*0.22),0.02*W,-Li*0.03*k];gi.along(P_bicone(4),p,[0.2,0.5,1],W*0.12,W*0.025,C.h);}
      for(const t of tips)go.along(P_bicone(4),t,_n3(t),W*0.14,W*0.03,C.g,true);}
    if(glowWing)for(const t of tips)go.add(P_sphere(4,3),{s:W*0.03,t,c:C.g,glow:true});
    return {elbow};
  }
  if(type==='feather'){
    const elbow=[Li,0,-Li*0.08];
    gi.along(P_cyl(0.75,1,5),[0,0,0],elbow,Li*1.02,W*0.06,mem);
    for(let k=0;k<5;k++){const u=k/4;const p=[Li*(0.1+u*0.85),-0.005*W,-Li*0.06*u];
      gi.along(P_cone(4),p,[0.12,-0.02,-1],ch*(0.75-u*0.1),[W*0.07,W*0.012],l=>l[1]>0.3?C.a:mem);}
    go.along(P_cyl(0.6,1,5),[0,0,0],[Lo*0.5,0,0],Lo*0.5,W*0.05,mem);
    for(let k=0;k<7;k++){const u=k/6;const a=lerp(0.05,1.35,u);const p=[Lo*lerp(0.5,0.05,u),0,0];const d=[Math.cos(a),0,-Math.sin(a)];
      const len=lerp(Lo*0.62,ch*0.85,u);go.along(P_cone(4),p,d,len,[W*0.075,W*0.012],l=>l[1]>0.3?C.a:mem);
      if(glowWing||anc)go.along(P_cone(4),add3(p,d,len*0.6),d,len*0.42,[W*0.05,W*0.012],C.g,true);}
    return {elbow};
  }
  if(type==='flipper'){const L=W*0.95;gi.along(P_sphere(8,4),[0,0,0],[1,-0.12,-0.22],L,[W*0.13,W*0.035],(l,w)=>l[1]<0?C.u:C.b);
    for(let k=0;k<6;k++){const u=0.2+k*0.13;gi.add(P_sphere(4,3),{s:[W*0.035,W*0.03,W*0.035],t:[L*u*0.98,-L*u*0.12+W*0.005,-L*u*0.22+W*0.1*(1-u*0.6)],c:C.u});}
    return {elbow:null};}
  // 昆虫系（花弁・蛾）
  // 輪郭を平らな多角形で作る（前翅は前寄り、後翅は後ろへ）。根元が体に食い込まない
  const hind=pair===1;const s=W*0.78*(hind?0.78:1);
  const out=type==='petal'?(hind?[[0.06,-0.04],[0.4,-0.14],[0.78,-0.4],[0.72,-0.62],[0.42,-0.6],[0.14,-0.3]]:[[0.06,0.03],[0.38,0.2],[0.82,0.26],[1,0.06],[0.86,-0.14],[0.45,-0.16],[0.12,-0.05]])
    :(hind?[[0.06,-0.04],[0.45,-0.1],[0.82,-0.3],[0.86,-0.55],[0.62,-0.78],[0.3,-0.62],[0.1,-0.24]]:[[0.06,0.04],[0.32,0.26],[0.7,0.38],[1,0.3],[1.02,0.05],[0.78,-0.16],[0.4,-0.18],[0.12,-0.06]]);
  const P2=out.map(([x,z])=>[x*s,0,z*s]);let cx=0,cz=0;for(const p of P2){cx+=p[0];cz+=p[2];}const c=[cx/P2.length,0.004*s,cz/P2.length];
  const edge=type==='petal'?C.h:shade(mem,0.62);
  for(let i=0;i<P2.length;i++){const a=P2[i],b=P2[(i+1)%P2.length];const ma=[lerp(c[0],a[0],0.72),c[1],lerp(c[2],a[2],0.72)],mb=[lerp(c[0],b[0],0.72),c[1],lerp(c[2],b[2],0.72)];
    gi.tri(c,ma,mb,i%2?mem:mixc(mem,0xffffff,0.12));gi.tri(ma,a,b,edge);gi.tri(ma,b,mb,edge);}
  gi.along(P_cyl(0.4,1,4),[0,0,0],[out[3][0],0,out[3][1]],Math.hypot(out[3][0],out[3][1])*s*0.9,s*0.012,shade(mem,0.5));
  if(type==='moth'||!hind){const ec=[c[0]*1.15,c[1]+s*0.004,c[2]*1.1];gi.add(P_sphere(6,3),{s:[s*0.1,s*0.006,s*0.1],t:ec,c:C.a});gi.add(P_sphere(5,3),{s:[s*0.045,s*0.008,s*0.045],t:add3(ec,[0,s*0.003,0]),c:anc?C.g:0x101020,glow:anc});}
  return {elbow:null};
}

// ---- メイン：ドラゴン形状 ----
const DGEO={};
// 使われなくなったドラゴンの形状はGPUメモリから解放する（スマホのメモリ不足対策）
function releaseUnusedGeo(now){for(const k in DGEO){const G=DGEO[k];if(G.refs>0||now-G.last<30)continue;
  const d=g=>{if(g)g.dispose();};G.segs.forEach(s=>{d(s.geo);d(s.glow);});G.neck.forEach(s=>{d(s.geo);d(s.glow);});d(G.head.geo);d(G.head.glow);d(G.jaw.geo);d(G.jaw.glow);
  G.legs.forEach(l=>{d(l.upper);d(l.lower);d(l.foot);});G.wings.forEach(w=>{d(w.inner);d(w.innerGlow);d(w.outer);d(w.outerGlow);});delete DGEO[k];}}
function dragonGeo(sp,st){
  const key=sp.id+'_'+st;if(DGEO[key])return DGEO[key];
  const S=sp.size*SK.scale[st];const C=sp.col;const anc=st===3;const G={S,serp:sp.serp,segs:[],neck:[],legs:[],wings:[]};
  // 胴体チェーン
  const segDefs=[];
  if(sp.serp){const n=sp.bodyN;for(let i=0;i<n;i++){const t=i/(n-1);
      const r=sp.bodyR*S*SK.body[st]*(t<0.12?lerp(0.78,1,t/0.12):t>0.5?lerp(1,0.18,Math.pow((t-0.5)/0.5,1.1)):1);
      const len=sp.bodyL*S*(t>0.6?lerp(1,0.75,(t-0.6)/0.4):1)*(st===0?0.85:1);
      segDefs.push({kind:'serp',r,hk:sp.bodyH,len,bend:0.55,idx:i});}}
  else{for(let i=0;i<sp.bodyN;i++){const r=sp.bodyR*S*SK.body[st]*(0.92+0.13*Math.sin(Math.PI*(i+0.5)/sp.bodyN));
      segDefs.push({kind:'body',r,hk:sp.bodyH,len:sp.bodyL*S*(st===0?0.9:1),bend:0.32,idx:i});}
    const r0=sp.bodyR*S*0.72*sp.tailR;for(let j=0;j<sp.tailN;j++){const t=sp.tailN>1?j/(sp.tailN-1):1;
      segDefs.push({kind:'tail',r:r0*lerp(1,0.22,Math.pow(t,0.85)),hk:sp.bodyH*0.95,len:sp.tailL*S*SK.tail[st]*lerp(1,0.8,t),bend:0.5,idx:j});}}
  const R0=segDefs[0].r;
  segDefs.forEach((d,i)=>{const gb=new GB();const last=i===segDefs.length-1;
    const blocky=sp.extras.includes('blocky');

// ================= AI =================
function fight(d,tgt,dt){
  entCenter(tgt,_q);d.center(_w);const dx=_q.x-_w.x,dz=_q.z-_w.z;const dist=Math.hypot(dx,dz);const reach=1.2+d.S*1.6+(tgt.radius||0.4);
  const ty=Math.atan2(dx,dz);d.look=clamp(angDiff(ty,d.yaw),-0.9,0.9);
  // 飛行の追従
  const tAlt=_q.y-H(_q.x,_q.z);
  if(d.canFly()&&!d.sp.float){if(tAlt>4){d.flying=true;d.flyH=clamp(tAlt,4,30);}else if(d.flying&&tAlt<2)d.flying=false;}
  if(d.stage>=2&&d.cd.breath<=0&&dist<8+d.S*3&&Math.random()<dt*1.5){castBreath(d,tgt);}
  if(dist>reach*0.85)d.drive(dx,dz,1,dt,d.team==='ally'?1.15:1);
  else{d.drive(dx,dz,Math.abs(angDiff(ty,d.yaw))>0.4?0.25:0,dt);if(Math.abs(angDiff(ty,d.yaw))<0.7)tryBite(d,tgt);}
}
function aiWild(d,dt){const A=d.ai;const P=player.mount||player;

  A.think-=dt;const pp=P.isPlayer?P.pos:P.pos;const dp=Math.hypot(pp.x-d.pos.x,pp.z-d.pos.z);
  const nearBase=Math.hypot(pp.x-BASE.x,pp.z-BASE.z)<26;
  if(A.state==='wander'){
    if(A.think<=0){A.think=rnd(2.5,6);if(Math.random()<0.35){A.tx=d.pos.x;A.tz=d.pos.z;}else{const a=Math.random()*TAU,r=rnd(5,20);A.tx=A.home[0]+Math.cos(a)*r;A.tz=A.home[1]+Math.sin(a)*r;}
      if(d.canFly()&&!d.sp.float&&Math.random()<0.3){d.flying=!d.flying;d.flyH=rnd(7,15);}
      if(Math.random()<0.12&&!d.flying)d.anim.roar=1;}
    const dx=A.tx-d.pos.x,dz=A.tz-d.pos.z;const dist=Math.hypot(dx,dz);d.drive(dx,dz,dist>1.5?(d.flying?0.6:0.42):0,dt);d.look=Math.sin(game.t*0.5+d.frame)*0.5;
    if(d.sp.aggro===2&&dp<14&&!nearBase&&!player.dead){A.state='chase';A.target=P;d.anim.roar=1;}
  }else if(A.state==='chase'){let t=A.target;if(t&&t.isPlayer&&t.mount)t=t.mount;if(t===player&&player.mount)t=player.mount;
    if(!t||t.dead||(t.isMount&&!player.mount)){t=P;A.target=P;}

    if(dist>45||nearBase&&(t===P)||player.dead){A.state='wander';A.target=null;d.flying=false;return;}fight(d,t,dt);}
  else if(A.state==='flee'){A.flee-=dt;const t=A.target||P;const dx=d.pos.x-t.pos.x,dz=d.pos.z-t.pos.z;d.drive(dx,dz,0.75,dt);if(d.canFly()&&!d.sp.float&&d.stage>=2){d.flying=true;d.flyH=10;}

function aiAlly(d,dt,idx){

// ================= 出現管理 =================

function panelAct(act,v,w){
  const sr=slimeAct(act,v,w);if(sr==='closed')return;if(sr===true){renderPanel();return;}
  const dd=S.dragons.find(d=>d.uid===+v);
  switch(act){
    case 'sel':selUid=+v;break;
    case 'party':if(S.party.length<3&&!S.party.includes(+v)){S.party.push(+v);syncParty();}break;
    case 'unparty':S.party=S.party.filter(u=>u!==+v);if(S.ride===+v)S.ride=null;syncParty();break;
    case 'ride':if(!S.party.includes(+v)){if(S.party.length>=3)S.party.pop();S.party.push(+v);}syncParty();{const a=findAlly(+v);if(a){if(a.data.hp<=0){toast('力尽きている');break;}closePanel();a.pos.set(player.pos.x+1.5,0,player.pos.z+1.5);a.pos.y=a.gfn(a.pos.x,a.pos.z);a.rig.inited=false;if(player.mount)dismount(true);mount(a);return;}}break;
    case 'potion':if(dd&&useItem('potion')){const a=findAlly(dd.uid);dd.hp=Math.min(maxHpOf(dd),Math.max(0,dd.hp)+50);if(a){a.hp=Math.min(a.maxHp,(a.dead?0:a.hp)+50);a.dead=0;a.rig.setVisible(true);}toast('回復した');}break;
    case 'feed':{const d2=S.dragons.find(d=>d.uid===selUid);if(d2&&useItem(v)){const a=findAlly(d2.uid);gainXpData(d2,ITEMS[v].feed,a);const m=maxHpOf(d2);d2.hp=Math.min(m,d2.hp+m*0.15);if(a)a.hp=Math.min(a.maxHp,a.hp+a.maxHp*0.15);
      toast(`${SP[d2.sp].name}にエサをあげた（経験値+${ITEMS[v].feed}）`,1.5);}break;}
    case 'eggsel':pvShow(v,-1,'idle');return;
    case 'place':placeEgg(+v);break;
    case 'ccat':craftCat=v;break;
    case 'craft':{const r=RECIPES.find(x=>x.id===v);if(recipeOwned(r)){if(r.g){curTab='gear';}break;}if(!recipeOK(r))break;for(const [k,n] of Object.entries(r.req))S.inv[k]-=n;
      if(r.w){S.weaponOwn[r.w]=1;if(WEAPONS[r.w].atk>=WEAPONS[S.weapon].atk){S.weapon=r.w;player.setWeapon(r.w);toast(`${r.i} ${r.n}を作って装備した！`);}else toast(`${r.n}を作った！`);}
      else if(r.g){const g=GEAR[r.g];S.gearOwn[r.g]=1;const c=GEAR[S.eq[g.slot]];const better=!c||(g.def||0)+(g.hp||0)*0.3>=(c.def||0)+(c.hp||0)*0.3&&g.slot!=='acc'||(!c&&g.slot==='acc');
        if(better){S.eq[g.slot]=r.g;recalcGear();toast(`${r.i} ${r.n}を作って装備した！（${gearDesc(g)}）`,3);}else toast(`${r.n}を作った！「🛡 装備」タブで付け替えられる`,3);
        fxs.burst(player.pos.x,player.pos.y+1.2,player.pos.z,20,rgb(g.col),3,0.8,0.2,-1);}
      else if(r.key){S[r.key]=true;toast(`${r.n}を作った！若竜以上に騎乗できる`);}else{addItem(r.out,1);toast(`${r.n}を作った！`);}saveGame();break;}
    case 'equip':if(w==='weapon'){S.weapon=v;player.setWeapon(v);}else{S.eq[w]=v;recalcGear();}toast('装備を変えた',1.2);break;
    case 'unequip':S.eq[v]=null;recalcGear();break;
    case 'eat':{const it=ITEMS[v];if(useItem(v)){S.hunger=Math.min(100,S.hunger+it.eat);if(v==='berry')S.hp=Math.min(pMaxHp(),S.hp+3);toast(`${it.n}を食べた（空腹+${it.eat}）`,1.2);}break;}
    case 'drink':if(useItem('potion')){S.hp=Math.min(pMaxHp(),S.hp+50);toast('HPが回復した');}break;
    case 'dsel':dexSel=v;break;case 'dstage':dexStage=+v;break;case 'dmode':dexMode=v;break;
    case 'shadow':S.opt.shadow=!S.opt.shadow;applyShadow();break;
    case 'wildmax':S.opt.wildMax=S.opt.wildMax>=14?6:S.opt.wildMax+4;break;
    case 'res':S.opt.res=S.opt.res===1?0.75:S.opt.res<1?1.25:1;onResize();break;
    case 'bgm':S.opt.bgm=!S.opt.bgm;if(S.opt.bgm)bgmStart();else bgmStop();break;
    case 'vol':S.opt.vol=S.opt.vol<=0.25?0.5:S.opt.vol<=0.5?0.8:0.25;bgmVol();break;
    case 'save':saveGame();toast('保存しました');break;
    case 'reset':if(confirm('本当にデータを初期化しますか？')){localStorage.removeItem(SAVE_KEY);location.reload();}return;
  }
  renderPanel();}

const carried=()=>Object.values(S.inv).reduce((a,b)=>a+(b||0),0);
function plGainXp(n){const P=S.pl;if(P.lv>=MAXLV)return;P.xp+=Math.round(n);let up=0;
  while(P.xp>=xpNeed(P.lv)&&P.lv<MAXLV){P.xp-=xpNeed(P.lv);P.lv++;up++;}
  if(up){S.hp=pMaxHp();player.center(_v);fxs.burst(_v.x,_v.y,_v.z,40,[0.5,0.9,1],5,1.2,0.3,-1);floatText(_v,'LEVEL UP!','#9ff');player.qv+=8;
    toast(`💧 レベル${P.lv}になった！ 捕食できる竜：Lv${devourLimit()}まで／胃袋${plSlots()}つ`,3.5);}}
// 体内に入れる（容量制限あり）
function addItem(k,n=1){const room=Math.max(0,plCap()-carried());const m=Math.min(n,room);if(m>0)S.inv[k]=(S.inv[k]||0)+m;
  if(m<n){if(!game._fullT||game.t-game._fullT>4){game._fullT=game.t;toast('🫙 おなかがいっぱい！基地のコアにあずけよう');}}return m;}

// ---- スライムの形（まん丸のお餅型・なめらか） ----
function slimeGeometry(){const W=30,Hn=22;const pos=[],idx=[];
  for(let j=0;j<=Hn;j++){const th=j/Hn*Math.PI;let y=Math.cos(th),r=Math.sin(th);
    // まん丸のお餅：上はふっくら、底はぺたんと平ら、横がほんのりふくらむ
    if(y>0){r*=1+0.06*(1-y);y=y*0.88;}else{r*=1.06-0.05*(-y);y=y*0.2;}
    for(let i=0;i<=W;i++){const ph=i/W*TAU;pos.push(r*Math.cos(ph),y+0.22,r*Math.sin(ph));}}
  for(let j=0;j<Hn;j++)for(let i=0;i<W;i++){const a=j*(W+1)+i,b=a+W+1;idx.push(a,a+1,b+1,a,b+1,b);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();g.computeBoundingSphere();return g;}
const GRAV=17;
const slimeGround=(x,z)=>Math.max(H(x,z),WATER_Y-0.12);

class Slime{
  constructor(){this.isPlayer=true;this.team='ally';this.radius=0.45;this.pos=new THREE.Vector3(BASE.x+2,0,BASE.z+5);this.pos.y=slimeGround(this.pos.x,this.pos.z);
    this.yaw=Math.PI;this.vy=0;this.air=false;this.speed=0;this.mount=null;this.atkT=0;this.atkCd=0;this.dead=0;this.hitT=0;this.gather=0;
    this.q=1;this.qv=0;this.sz=1;this.az=1;this.lean=0;this.wob=0.02;this.t=0;this.landT=0;this.devour=null;this.shootT=0;this.mouth=0;this.blink=3;this.eatT=0;this.hitDone=false;
    this.build();}
  base(){return 0.55+Math.min(S.pl.lv,50)*0.012;}
  build(){const g=new THREE.Group();this.g=g;scene.add(g);const b=new THREE.Group();this.bg=b;g.add(b);
    this.U={uTime:{value:0},uWob:{value:0.02}};
    const mat=new THREE.MeshPhongMaterial({color:0x58c8ff,emissive:0x0c3c70,specular:0xffffff,shininess:120,transparent:true,opacity:0.8,depthWrite:false});
    mat.onBeforeCompile=sh=>{sh.uniforms.uTime=this.U.uTime;sh.uniforms.uWob=this.U.uWob;
      sh.vertexShader='uniform float uTime;\nuniform float uWob;\n'+sh.vertexShader.replace('#include <begin_vertex>',
`#include <begin_vertex>
  float wv=sin(position.y*7.0+uTime*5.0)*0.6+sin(position.x*6.0+position.z*5.0-uTime*4.2)*0.4;
  transformed+=normal*uWob*wv*smoothstep(0.05,0.3,position.y);`);};
    mat.customProgramCacheKey=()=>'slimebody';this.mat=mat;
    const body=new THREE.Mesh(slimeGeometry(),mat);body.castShadow=true;body.renderOrder=3;b.add(body);this.body=body;
    // 光る核
    const cg=new GB();cg.add(P_sphere(8,6),{s:[0.32,0.24,0.32],t:[0,0.46,0],c:0xb8f0ff});
    const core=new THREE.Mesh(cg.geo(),new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));core.renderOrder=4;b.add(core);this.core=core;
    // 目と口（ころんとした顔）
    const eg=new GB();eg.add(P_sphere(8,6),{s:[0.085,0.13,0.06],t:[0,0,0],c:0x0a1430});eg.add(P_sphere(5,4),{s:0.035,t:[0.025,0.05,0.045],c:0xffffff});
    this.eyes=[-1,1].map(sd=>{const m=new THREE.Mesh(eg.geo(),MAT.body);m.position.set(sd*0.3,0.56,0.89);m.rotation.y=sd*0.32;b.add(m);return m;});
    const mg=new GB();mg.add(P_sphere(8,5),{s:[0.12,0.06,0.05],c:0x0a1430});this.mouthM=new THREE.Mesh(mg.geo(),MAT.body);this.mouthM.position.set(0,0.4,1.0);this.mouthM.visible=false;
    const ch=new GB();ch.add(P_sphere(6,4),{s:[0.07,0.035,0.02],c:0xff9ac0});this.cheeks=[-1,1].map(sd=>{const m=new THREE.Mesh(ch.geo(),MAT.glow);m.position.set(sd*0.55,0.44,0.86);m.rotation.y=sd*0.55;b.add(m);return m;});
    // 消化中の獲物（体の中で回る）
    const fg=new GB();fg.add(P_sphere(7,5),{s:0.28,c:0xffffff});this.food=new THREE.Mesh(fg.geo(),new THREE.MeshLambertMaterial({color:0x6cc04a}));this.food.visible=false;b.add(this.food);
    const hg=new GB();hg.add(P_lathe([[0,-1],[0.62,-0.8],[0.95,-0.3],[0.9,0.25],[0.6,0.75],[0,1]],8),{s:[0.13,0.18,0.13],c:0xffffff});
    this.hatchM=new THREE.Mesh(hg.geo(),new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x302010}));this.hatchM.visible=false;b.add(this.hatchM);

  setWeapon(){} setGear(){}
  get atk(){return plATK();}
  center(out){return out.copy(this.pos).setY(this.pos.y+0.5*this.base()*this.sz);}
  takeDamage(d){if(this.dead)return;if(this.mount){this.mount.takeDamage(d);return;}
    S.hp-=d;this.hitT=0.3;this.qv-=6;this.U.uWob.value=0.12;this.center(_v);floatText(_v,'-'+Math.round(d),'#ff6060');
    fx.burst(_v.x,_v.y,_v.z,6,[0.5,0.85,1],3,0.4,0.12,8);

  respawn(){this.dead=0;S.hp=Math.round(pMaxHp()*0.6);S.hunger=Math.max(S.hunger,40);this.pos.set(BASE.x+2,0,BASE.z+5);this.pos.y=slimeGround(this.pos.x,this.pos.z);this.air=false;this.vy=0;this.sz=0.2;this.q=1;game.camX=undefined;game.camY=undefined;game._camInit=false;}
  cancelDevour(){const D=this.devour;if(!D)return;if(!D.hid){D.d.weak=6;}this.devour=null;this.sz=1;}
  // ---- 地面判定 ----
  ok(x,z,gy){if(!inWorld(x,z))return false;if(lavaAt(x,z))return false;const h=slimeGround(x,z);const d=Math.hypot(x-this.pos.x,z-this.pos.z)||1e-3;return this.air||(h-gy)/d<1.3;}
  move(dx,dz){const gy=slimeGround(this.pos.x,this.pos.z);let nx=this.pos.x+dx,nz=this.pos.z+dz;
    if(!this.ok(nx,nz,gy)){if(this.ok(nx,this.pos.z,gy))nz=this.pos.z;else if(this.ok(this.pos.x,nz,gy))nx=this.pos.x;else return;}
    this.pos.x=nx;this.pos.z=nz;collidePush(this.pos,0.3);}
  hop(h){this.air=true;this.vy=Math.sqrt(2*GRAV*h);this.qv+=5;}
  update(dt,inp){this.t+=dt;this.U.uTime.value=this.t;
    if(this.dead>0){this.dead-=dt;this.q=lerp(this.q,0.15,dt*4);this.U.uWob.value=0.15;this.apply(dt);if(this.dead<=0)this.respawn();return;}
    if(this.mount){this.g.visible=false;this.blob.visible=false;this.pos.copy(this.mount.pos);this.yaw=this.mount.yaw;return;}
    this.g.visible=true;this.blob.visible=true;
    this.atkCd-=dt;this.hitT-=dt;this.landT-=dt;this.shootT-=dt;this.eatT-=dt;
    if(this.devour){this.updDevour(dt);this.apply(dt);return;}
    const gy=slimeGround(this.pos.x,this.pos.z);const water=H(this.pos.x,this.pos.z)<WATER_Y-0.3;
    // 体当たり
    let qt=1+Math.sin(this.t*2.2)*0.035,azT=1;
    if(this.atkT>0){this.atkT-=dt;const p=1-this.atkT/0.42;
      if(p<0.24){qt=0.62;}
      else if(p<0.62){azT=1.65;qt=0.82;this.move(Math.sin(this.yaw)*9*dt,Math.cos(this.yaw)*9*dt);
        if(!this.hitDone&&p>0.42){this.hitDone=true;this.tackleHit();}}
      else{qt=0.85;}}
    // ぴょんぴょん移動
    const want=inp.mag>0.05&&this.atkT<=0&&this.eatT<=0;
    const run=inp.runOn&&S.st>3;
    if(want)this.yaw=lerpAngle(this.yaw,Math.atan2(inp.dx,inp.dz),1-Math.exp(-dt*12));
    if(!this.air&&want&&this.landT<=0)this.hop(water?0.16:run?0.34:0.26);
    {const sp=4.4*(run?1.35:1)*(water?0.72:1)*inp.mag;if(want||(this.big&&this.air))this.move(inp.dx*sp*dt,inp.dz*sp*dt);}
    if(this.air){
      this.vy-=GRAV*dt;this.pos.y+=this.vy*dt;qt=this.vy>0?1.18:0.96;
      const g2=slimeGround(this.pos.x,this.pos.z);
      if(this.pos.y<=g2&&this.vy<0){this.pos.y=g2;this.air=false;this.big=false;const imp=Math.min(1,-this.vy/12);this.qv-=5+imp*8;this.landT=0.1;this.U.uWob.value=0.05+imp*0.07;
        this.center(_v);fx.burst(this.pos.x,this.pos.y+0.1,this.pos.z,water?10:4+Math.round(imp*8),water?[0.6,0.85,1]:[0.55,0.85,1],2.5+imp*3,0.4,0.08,9);}}
    else this.pos.y=lerp(this.pos.y,gy+(water?Math.sin(this.t*2)*0.05:0),1-Math.exp(-dt*18));

    this.blink-=dt;if(this.blink<0)this.blink=2.5+Math.random()*3;const bl=this.blink<0.12?0.15:1;for(const e of this.eyes)e.scale.y=bl;
    this.mouth=lerp(this.mouth,this.eatT>0||this.shootT>0?1:0,dt*12);this.mouthM.scale.set(1,1+this.mouth*3,1);
  }
  apply(dt){const qt=this.qt||1;this.qv+=((qt-this.q)*95-this.qv*7.5)*dt;this.q+=this.qv*dt;this.q=clamp(this.q,0.35,1.7);

    this.bg.scale.set(s*xz/Math.sqrt(this.az),s*this.q,s*xz*this.az);this.bg.rotation.x=this.lean;
    this.g.position.copy(this.pos);this.g.rotation.set(0,this.yaw,0);
    this.core.scale.setScalar(1+Math.sin(this.t*3)*0.08);this.core.rotation.y=this.t;
    const st=S.stomach[0];if(st&&!this.devour){this.food.visible=true;const k=st.rem/st.tot;this.food.material.color.setHex(st.egg?SP[st.sp].egg.c1:SP[st.sp].col.b);
      this.food.scale.setScalar(0.35+0.85*k);this.food.position.set(Math.sin(this.t*1.3)*0.15,0.42+Math.sin(this.t*2.1)*0.04,Math.cos(this.t*1.3)*0.15);this.food.rotation.set(this.t,this.t*0.7,0);}
    else if(!this.devour)this.food.visible=false;
    const hh=S.hatch[0];this.hatchM.visible=!!hh;if(hh){this.hatchM.material.color.setHex(SP[hh.sp].egg.c1);const w=hh.rem<10?Math.sin(this.t*25)*0.25:Math.sin(this.t*2)*0.1;this.hatchM.position.set(0.25,0.5,-0.1);this.hatchM.rotation.set(w,this.t*0.5,w*0.6);}
    const gy=slimeGround(this.pos.x,this.pos.z);this.blob.position.set(this.pos.x,gy+0.06,this.pos.z);const sh=(1.1*this.base()*this.sz)*(1-clamp((this.pos.y-gy)/6,0,0.6));this.blob.scale.set(sh,1,sh);}
  tackleHit(){let any=false;const hitR=1.5+this.base();
    for(const d of game.wild){if(d.dead||d.devouring)continue;d.center(_v);const dx=_v.x-this.pos.x,dz=_v.z-this.pos.z;const dist=Math.hypot(dx,dz)-d.radius;
      if(dist<hitR&&Math.abs(_v.y-this.pos.y)<2.5+d.S){const a=Math.abs(angDiff(Math.atan2(dx,dz),this.yaw));if(a<1.4||dist<0.7){hitEnt(this,d,plATK(),null);any=true;}}}
    this.center(_v);fx.burst(_v.x+Math.sin(this.yaw)*0.6,_v.y,_v.z+Math.cos(this.yaw)*0.6,any?14:6,[0.55,0.88,1],any?5:3,0.5,0.14,8);
    if(any){this.qv-=7;this.U.uWob.value=0.1;}else harvestNear(2.2,true);}
  startDevour(d){this.devour={d,t:0,p0:this.pos.clone(),big:Math.max(1.7,d.rig.G.len*0.42/this.base()),hid:false};d.devouring=true;d.weak=999;d.speed=0;d.flying=false;

// ---- 捕食・食事 ----
function devourCheck(d){if(d.lv>devourLimit())return {ok:false,msg:`Lv${d.lv-2}以上で捕食できる`};
  if(S.stomach.length>=plSlots())return {ok:false,msg:'胃袋がいっぱい（消化を待とう）'};return {ok:true};}
function attemptTame(d){if(d.team!=='wild'||d.dead||!(d.weak>0)||d.devouring||player.devour)return;const c=devourCheck(d);if(!c.ok){toast('🚫 '+c.msg);return;}player.startDevour(d);}
function harvest(e){const D=ENV_DEFS[e.t];if(carried()>=plCap()){addItem('wood',0);toast('🫙 おなかがいっぱい！基地のコアにあずけよう');return;}
  e.o.hits--;player.eatT=0.35;player.qv-=4;player.U.uWob.value=0.07;
  fx.burst(e.o.x,e.o.y+0.6,e.o.z,6,e.t==='bush'?[0.4,0.3,0.8]:e.t.includes('rock')||e.t==='boulder'||e.t==='iron'?[0.6,0.6,0.6]:e.t==='crystal'?[0.6,0.9,1]:[0.5,0.4,0.25],3,0.5,0.15,8);
  if(e.o.hits>0)return;const got=[];for(const k in D.res){const [a,b]=D.res[k];const n=addItem(k,rint(a,b));if(n>0)got.push(ITEMS[k].i+'×'+n);}
  if(D.res.berry)S.hunger=Math.min(100,S.hunger+4);
  e.o.alive=false;e.o.timer=D.resp;setEnvVisible(e.t,e.i,false);
  // 素材が吸い込まれる演出
  player.center(_w);for(let i=0;i<8;i++)fxs.spawn(e.o.x+rnd(-0.5,0.5),e.o.y+rnd(0.3,1.5),e.o.z+rnd(-0.5,0.5),(_w.x-e.o.x)*2.5,(_w.y-e.o.y)*2.5,(_w.z-e.o.z)*2.5,0.4,0.15,[0.7,0.95,1],0,0);
  _v.set(e.o.x,e.o.y+1.5,e.o.z);if(got.length)floatText(_v,'もぐもぐ '+got.join(' '),'#bfe');}
function takeEgg(n){const o=n.nest;if(!o.egg)return;if(S.stomach.length>=plSlots()){toast('🌀 胃袋がいっぱい（消化を待とう）');return;}
  const list=BIOME_SP[o.b];let tot=0;list.forEach(s=>tot+=s.w);let rr=Math.random()*tot;let sp=list[0];for(const x of list){rr-=x.w;if(rr<=0){sp=x;break;}}
  o.egg=false;o.timer=240;setEnvVisible('nestegg',n.idx,false);addItem('scale',1);player.eatT=0.4;S.seen[sp.id]=1;
  const t2=26+sp.tier*8;S.stomach.push({sp:sp.id,egg:true,lv:1,rem:t2,tot:t2});plGainXp(8+sp.tier*4);
  toast(`🥚 ${sp.name}の卵をまるのみ！（経験値少し）${incSlots()?'消化される前に💧タブで「孵化装置へ」移すと孵化できる':'コアで「体内孵化装置」を作ると、消化前の卵を孵化できる'}`,4.5);}
// ---- 倒した時 ----
function onDragonDown(d,att){
  if(d.team==='wild'){d.dead=2.2;d.speed=0;d.flying=false;
    const xp=Math.round((10+d.lv*4)*(1+d.sp.tier*0.2));plGainXp(xp);
    const meat=addItem('meat',1+Math.round(d.S*1.6)+d.stage);let msg=`${d.sp.name}を倒した！（経験値+${xp}） 🍖×${meat}`;

function findContext(){const P=player.mount||player;const p=P.pos;const rr=player.mount?player.mount.S*1.5:0;let best=null,bd=1e9;
  if(player.mount&&p.y-H(p.x,p.z)>2.5)return {kind:null,label:'調べる'};
  if(!player.mount)for(const d of game.wild){if(d.weak>0&&!d.dead&&!d.devouring){const dist=d.pos.distanceTo(p)-d.radius;if(dist<4.5&&dist<bd){bd=dist;const c=devourCheck(d);best={kind:'tame',d,label:c.ok?'捕食':'Lv不足'};}}}
  if(best)return best;
  for(const n of NESTS){if(!n.nest.egg)continue;const dist=Math.hypot(n.nest.x-p.x,n.nest.z-p.z);if(dist<3.2+rr&&dist<bd){bd=dist;best={kind:'nest',n,label:'卵を食べる'};}}

      if(S.st<=0){if(H(m.pos.x,m.pos.z)<-0.7&&!m.sp.swim){m.flyH=Math.max(1.5,m.flyH-dt*6);}else{m.flying=false;toast('スタミナ切れ！着陸する');}}}
    const t=game.focus&&!game.focus.dead?game.focus:null;if(t){_v.copy(t.pos).sub(m.pos);m.look=clamp(angDiff(Math.atan2(_v.x,_v.z),m.yaw),-0.9,0.9);if(_v.length()>30)game.focus=null;}else m.look=0;}
  // --- AI ---
  game.allies.forEach((a,i)=>{if(a.dead||a.isMount)return;aiAlly(a,dt,i);});
  for(const d of game.wild){if(d.dead)continue;aiWild(d,dt);}
  // --- 物理・アニメ ---
  _camT.copy((player.mount||player).pos);
  const all=game.allies.concat(game.wild);
  for(const d of all){
    for(const k in d.cd)d.cd[k]-=dt;
    if(d.pend.length){d.pend=d.pend.filter(p=>{p.t-=dt;if(p.t<=0){if(!d.dead)p.fn();return false;}return true;});}
    if(d.dead){d.speed=0;if(d.team==='wild'){d.dead-=dt;if(d.dead<=0&&!d._remove){d._remove=true;d.center(_v);fxs.burst(_v.x,_v.y,_v.z,24,[1,1,1],4,0.8,0.3,-1);}}
      else{d.dead=Math.min(d.dead+dt,3);if(d.dead>2.5)d.rig.setVisible(false);}}
    if(!d.dead||d.team==='wild')d.physics(dt);
    const dist=d.pos.distanceTo(_camT);d.camDist=dist;const vis=dist<125&&!(d.team==='ally'&&d.dead>2.5);d.rig.setVisible(vis);
    if(vis)d.animate(dt,d.isMount);
  }
  player.update(dt,inp);slimeTick(dt,inp);zoneTick(dt);
  updateCombatFX(dt);fx.update(dt);fxs.update(dt);
  // --- サバイバル ---
  S.hunger=Math.max(0,S.hunger-dt*(0.1+(inp.runOn?0.08:0)));
  if(S.hunger<=0){S.hp-=dt*1.2;if(S.hp<=0&&!player.dead){S.hp=0;player.die();}}
  else if(S.hunger>35&&player.hitT<-3&&S.hp<pMaxHp())S.hp=Math.min(pMaxHp(),S.hp+dt*0.9*game.gs.regen);
  if(!m&&!(inp.runOn&&inp.mag>0.5))S.st=Math.min(pMaxSt(),S.st+dt*(inp.mag>0.1?7:13)*game.gs.stam);
  if(!m&&inp.runOn&&inp.mag>0.5)S.st=Math.max(0,S.st-dt*6);
  for(const a of game.allies){if(!a.dead&&a.hp<a.maxHp&&!a.ai.target){a.hp=Math.min(a.maxHp,a.hp+a.maxHp*0.006*dt);if(a.data)a.data.hp=a.hp;}}
  // --- 出現・発見 ---
  spawnT-=dt;if(spawnT<=0){spawnT=1.2;spawnWild();despawn();}
  discT-=dt;if(discT<=0){discT=0.5;for(const d of game.wild){if(!d.dead&&!S.seen[d.sp.id]&&d.pos.distanceTo(_camT)<35){S.seen[d.sp.id]=1;if(!S.dex[d.sp.id])toast(`👁 見たことのないドラゴンだ…（捕食すると図鑑に登録される）`,2.5);}}}
  envT-=dt;if(envT<=0){envT=1;updateEnvTimers(1);}
  bioT-=dt;if(bioT<=0){bioT=0.5;const b=biomeAt(_camT.x,_camT.z);if(b!==game.lastBiome){game.lastBiome=b;const el=$('banner');el.innerHTML='<div class="bt">'+BIOMES[b].n+'</div><div class="bs">'+BIOME_POEM[b]+'</div>';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
      $('biomeTag').textContent=BIOMES[b].n;}}
  saveT-=dt;if(saveT<=0){saveT=15;saveGame();}
  // --- 環境演出 ---
  dayCycle(dt);atmosphere(dt);cinematic(dt,inp);updateTerrainVis(_camT.x,_camT.z);
  if((game.gcT=(game.gcT||0)-dt)<=0){game.gcT=10;releaseUnusedGeo(performance.now()/1000);}refreshEnv(_camT.x,_camT.z);updateClouds(dt);
  }catch(e){reportErr('ゲーム処理',e);}
  // --- カメラ ---
  const P=player.mount||player;// スライムが跳ねても画面が上下しないよう、カメラは地面の高さをゆっくり追う
  if(P.isPlayer){const gy=player.dead?P.pos.y:Math.max(slimeGround(P.pos.x,P.pos.z),P.air&&P.big?P.pos.y-1.2:-99);game.camY=game.camY===undefined?gy:lerp(game.camY,gy,1-Math.exp(-dt*2.5));}
  if(game.camX===undefined||Math.hypot(game.camX-P.pos.x,game.camZ-P.pos.z)>15){game.camX=P.pos.x;game.camZ=P.pos.z;}
  const kc=1-Math.exp(-dt*(P.isPlayer?3.5:6));game.camX=lerp(game.camX,P.pos.x,kc);game.camZ=lerp(game.camZ,P.pos.z,kc);
  const tgt=P.isPlayer?_v.set(game.camX,game.camY+0.9,game.camZ):P.rig.chest(_v);
  if(P.isPlayer&&player.dead)tgt.y-=0.5;
  const dist=game.camDist+(player.mount?player.mount.S*3.2:0);const cp=game.camPitch;
  const want=_w.set(tgt.x+Math.sin(game.camYaw)*Math.cos(cp)*dist,tgt.y+Math.sin(cp)*dist,tgt.z+Math.cos(game.camYaw)*Math.cos(cp)*dist);
  const gyC=H(want.x,want.z)+1.2;if(want.y<gyC)want.y=gyC;
  camera.position.lerp(want,1-Math.exp(-dt*(P.isPlayer?4:6)));if(!game._camInit){camera.position.copy(want);game._camInit=true;}
  _q.copy(tgt);camera.lookAt(_q);
  // 影のカメラはプレイヤー周辺だけ
  sun.target.position.copy(tgt);sun.position.copy(tgt).addScaledVector(_sunDir,70);
  if(MAT.lava){const k=0.85+Math.sin(game.t*2)*0.15;MAT.lava.color.setRGB(1,0.35*k+0.05,0.08);}
  try{renderer.render(scene,camera);}catch(e){reportErr('描画',e);}
  if(!uiHidden)updateHUD(dt);updateFloat(dt);updateToast(dt);
}
let lastTod=null,moon=null;
function dayCycle(dt){const pd=S.day;S.day=(S.day+dt/600)%1;if(S.day<pd)S.dayN=(S.dayN||0)+1;
  const tod=timeOfDay();if(lastTod&&tod!==lastTod){
    if(tod==='night')toast(isFullMoon()?'🌕 今夜は満月…深淵から伝説の竜が蘇るかもしれない':'🌙 夜になった。夜行性のドラゴンたちが目を覚ます',4);
    else if(tod==='day')toast('☀ 朝になった。昼のドラゴンが姿を見せはじめる',3.5);
    else toast(Math.cos(S.day*TAU)<0?'🌅 夕暮れどき…この時間だけ現れる竜がいる':'🌄 明け方…この時間だけ現れる竜がいる',3.5);}
  lastTod=tod;
  game.bolt-=dt;let flash=0;
  if(game.lastBiome==='ruins'){if(game.bolt<=0){game.bolt=rnd(5,12);const a2=Math.random()*TAU,r=rnd(25,60);const x=_camT.x+Math.cos(a2)*r,z=_camT.z+Math.sin(a2)*r;
      lightning(new THREE.Vector3(x,H(x,z)+40,z),new THREE.Vector3(x,H(x,z),z),[0.85,0.75,1]);game.flash=0.35;}}
  game.flash=Math.max(0,(game.flash||0)-dt);
}
function ambient(dt){ambT-=dt;if(ambT>0)return;ambT=0.05;const b=game.lastBiome;const x=_camT.x,z=_camT.z,y=_camT.y;const night=Math.sin(S.day*TAU)<0;
  const R=()=>rnd(-22,22);
  if(b==='snow')for(let i=0;i<3;i++)fx.spawn(x+R(),y+rnd(6,14),z+R(),rnd(-0.5,0.5),-2,rnd(-0.5,0.5),5,0.09,[0.9,0.95,1],0,0.2);
  else if(b==='volcano')for(let i=0;i<2;i++){const px=x+R(),pz=z+R();fx.spawn(px,H(px,pz)+0.5,pz,rnd(-0.3,0.3),rnd(1,2.5),rnd(-0.3,0.3),3,0.1,[1,0.5,0.15],-0.2,0.3);}
  else if(b==='forest'||b==='swamp'){if(night||b==='swamp'){const px=x+R(),pz=z+R();fx.spawn(px,H(px,pz)+rnd(0.5,2.5),pz,rnd(-0.4,0.4),rnd(-0.2,0.3),rnd(-0.4,0.4),3,0.09,b==='swamp'?[0.6,0.8,1]:[0.7,1,0.3],0,0.1);}}
  else if(b==='ruins'){const px=x+R(),pz=z+R();fx.spawn(px,H(px,pz)+rnd(0.2,1.5),pz,0,rnd(0.5,1.2),0,2.5,0.1,[0.75,0.5,1],0,0.2);}
  else if(b==='meadow'&&!night&&Math.random()<0.5){const px=x+R(),pz=z+R();fx.spawn(px,H(px,pz)+rnd(0.5,2),pz,rnd(0.2,0.6),rnd(-0.1,0.2),rnd(-0.2,0.2),4,0.06,[1,1,0.75],0,0.05);}
  else if(b==='desert'&&Math.random()<0.4){const px=x+R(),pz=z+R();fx.spawn(px,H(px,pz)+rnd(0.2,1),pz,rnd(2,4),0,rnd(-0.5,0.5),2,0.08,[0.9,0.75,0.5],0,0.1);}
  // 火山の溶岩の泡・焚き火
  if(Math.random()<0.5)fx.spawn(baseObj.fire.x+rnd(-0.3,0.3),baseObj.fire.y+0.6,baseObj.fire.z+rnd(-0.3,0.3),rnd(-0.2,0.2),rnd(1.5,2.5),rnd(-0.2,0.2),0.8,0.18,[1,0.55,0.15],-0.5,0.5);
  if(Math.random()<0.3)fx.spawn(baseObj.incub.x+rnd(-1,1),baseObj.incub.y,baseObj.incub.z+rnd(-1,1),0,rnd(0.5,1),0,1.2,0.1,[1,0.6,0.2],0,0.2);
}
